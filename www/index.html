<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA OS</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2c;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #222f43;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(21, 28, 44, 0.9); position: sticky; top: 0; border-bottom: 1px solid var(--border); z-index: 10; }
    .logo-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block; margin-right: 6px; }
    h1 { font-size: 1.1rem; display: inline-block; }
    .status { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.15); color: var(--success); }

    main { padding: 20px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 1rem; color: var(--accent); margin-bottom: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }

    label { font-size: 0.8rem; color: var(--text-dim); margin-top: 8px; display: block; }
    input, select, textarea { width: 100%; margin-top: 4px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #0c1019; color: var(--text); font-size: 0.95rem; outline: none; }
    textarea { resize: none; height: 80px; }

    /* Barra de Atalhos Rápidos */
    .quick-actions { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-top: 10px; margin-bottom: 10px; }
    .quick-actions::-webkit-scrollbar { display: none; }
    .chip { background: #0c1019; border: 1px solid var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }

    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .btn-primary { flex: 1; background: var(--accent); color: #090d16; font-size: 1rem; font-weight: bold; padding: 12px; border-radius: 10px; border: none; cursor: pointer; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .btn-mic { background: var(--card-bg); border: 1px solid var(--accent); color: var(--accent); width: 50px; border-radius: 10px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-mic.recording { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.5s infinite; }

    .audio-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.8rem; color: var(--text-dim); }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .response-area { margin-top: 12px; padding: 12px; background: #0c1019; border-radius: 10px; border: 1px solid var(--border); font-size: 0.9rem; white-space: pre-wrap; max-height: 250px; overflow-y: auto; color: #cbd5e1; }

    /* Estilos Finanças */
    .finance-hero { text-align: center; padding: 16px; background: rgba(56,189,248,0.05); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; position: relative; }
    .finance-hero h2 { font-size: 1.8rem; margin-top: 4px; }
    .currency-selector { position: absolute; top: 12px; right: 12px; width: auto; padding: 4px 8px; font-size: 0.8rem; border-radius: 6px; background: var(--card-bg); color: var(--accent); border: 1px solid var(--border); }

    .tx-list { margin-top: 10px; max-height: 200px; overflow-y: auto; }
    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .tx-item:last-child { border-bottom: none; }
    .tx-amount.income { color: var(--success); font-weight: bold; }
    .tx-amount.expense { color: var(--danger); font-weight: bold; }

    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; }
    .nav-item { background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; cursor: pointer; }
    .nav-item.active { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div>
      <span class="logo-dot"></span>
      <h1>AURA OS</h1>
    </div>
    <span id="status-badge" class="status">● Online</span>
  </header>

  <main>
    <!-- ABA 1: CHAT COM VOZ & ATALHOS -->
    <section id="tab-chat" class="tab-content active">
      <div class="card">
        <div class="card-title">
          <span>🧠 Assistente AURA</span>
          <button class="btn-secondary" onclick="clearMemory()">Limpar Memória</button>
        </div>

        <label>Comandos Rápidos:</label>
        <div class="quick-actions">
          <button class="chip" onclick="setQuickAction('Resuma o seguinte texto de forma concisa e direta: ')">📝 Resumir Texto</button>
          <button class="chip" onclick="setQuickAction('Traduza o texto a seguir para Inglês e Alemão: ')">🌐 Traduzir (EN/DE)</button>
          <button class="chip" onclick="setQuickAction('Extraia os pontos principais e tópicos de ação do seguinte conteúdo: ')">📌 Pontos-Chave</button>
          <button class="chip" onclick="setQuickAction('Crie uma minuta de e-mail profissional curta e objetiva sobre: ')">✉️ Minuta Rápida</button>
        </div>

        <label>Como posso ajudar?</label>
        <textarea id="ai-prompt" placeholder="Digite ou toque no microfone..."></textarea>
        
        <div class="btn-group">
          <button id="mic-btn" class="btn-mic" onclick="toggleVoiceInput()">🎙️</button>
          <button class="btn-primary" onclick="sendAiChat()">Enviar</button>
        </div>

        <div class="audio-controls">
          <span>🔊 Resposta por voz</span>
          <button id="stop-audio-btn" class="btn-secondary" onclick="stopAudio()" style="display:none;">⏹️ Parar Voz</button>
        </div>

        <div id="ai-response" class="response-area">Aguardando comando...</div>
      </div>
    </section>

    <!-- ABA 2: EMAILS -->
    <section id="tab-email" class="tab-content">
      <div class="card">
        <div class="card-title">✉️ Minuta de E-mail</div>
        <label>Destinatário:</label>
        <input type="text" id="email-dest" placeholder="Ex: Fornecedor">
        <label>Assunto:</label>
        <input type="text" id="email-topic" placeholder="Ex: Orçamento de material">
        <label>Tom:</label>
        <select id="email-tone">
          <option value="profissional">Profissional</option>
          <option value="direto">Direto</option>
        </select>
        <button class="btn-primary" style="width:100%; margin-top:12px;" onclick="generateEmail()">Gerar Rascunho</button>
        <div id="email-response" class="response-area">O e-mail aparecerá aqui...</div>
      </div>
    </section>

    <!-- ABA 3: FINANÇAS COM SELETOR DE MOEDA -->
    <section id="tab-finances" class="tab-content">
      <div class="finance-hero">
        <select id="currency-select" class="currency-selector" onchange="changeCurrency()">
          <option value="CHF">CHF (Fr.)</option>
          <option value="EUR">EUR (€)</option>
          <option value="USD">USD ($)</option>
        </select>
        <span style="font-size:0.8rem; color:var(--text-dim);">Saldo Atual</span>
        <h2 id="fin-balance">CHF 0.00</h2>
      </div>

      <div class="card">
        <div class="card-title">➕ Nova Transação</div>
        <label>Descrição:</label>
        <input type="text" id="fin-desc" placeholder="Ex: Combustível">
        <label>Valor:</label>
        <input type="number" id="fin-amount" placeholder="0.00" step="0.01">
        <label>Tipo:</label>
        <select id="fin-type">
          <option value="expense">Despesa (-)</option>
          <option value="income">Receita (+)</option>
        </select>
        <button class="btn-primary" style="width:100%; margin-top:12px;" onclick="addTransaction()">Salvar</button>
      </div>

      <div class="card">
        <div class="card-title">📊 Últimas Transações</div>
        <div id="tx-list-container" class="tx-list">
          <span style="color:var(--text-dim); font-size:0.85rem;">Sem transações registadas.</span>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab-chat', this)">
      <span>🧠</span><span>AURA IA</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab-email', this)">
      <span>✉️</span><span>E-mails</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab-finances', this)">
      <span>💰</span><span>Finanças</span>
    </button>
  </nav>

  <script>
    const API_URL = 'https://aura-backend-rbjg.onrender.com/api';
    let recognition;
    let isRecording = false;
    let selectedCurrency = localStorage.getItem('aura_currency') || 'CHF';
    
    // Histórico de conversa salvo localmente
    let chatHistory = JSON.parse(localStorage.getItem('aura_history') || '[]');

    document.getElementById('currency-select').value = selectedCurrency;

    // Configurar Reconhecimento de Voz (STT)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-PT';
      recognition.continuous = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('mic-btn').classList.add('recording');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('ai-prompt').value = transcript;
        sendAiChat();
      };

      recognition.onerror = () => stopRecording();
      recognition.onend = () => stopRecording();
    }

    function toggleVoiceInput() {
      if (!recognition) {
        alert('O seu dispositivo não suporta entrada de voz.');
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopRecording() {
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('recording');
    }

    function setQuickAction(prefixText) {
      const promptInput = document.getElementById('ai-prompt');
      promptInput.value = prefixText;
      promptInput.focus();
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*#_`~]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'pt-PT';
        utterance.rate = 1.0;

        utterance.onstart = () => {
          document.getElementById('stop-audio-btn').style.display = 'inline-block';
        };

        utterance.onend = () => {
          document.getElementById('stop-audio-btn').style.display = 'none';
        };

        utterance.onerror = () => {
          document.getElementById('stop-audio-btn').style.display = 'none';
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        document.getElementById('stop-audio-btn').style.display = 'none';
      }
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    function clearMemory() {
      chatHistory = [];
      localStorage.removeItem('aura_history');
      stopAudio();
      document.getElementById('ai-response').innerText = 'Memória limpa. Como posso ajudar?';
    }

    async function sendAiChat() {
      const promptInput = document.getElementById('ai-prompt');
      const text = promptInput.value.trim();
      const resBox = document.getElementById('ai-response');
      
      if (!text) return;

      promptInput.value = '';
      stopAudio();

      chatHistory.push({ role: 'user', content: text });

      resBox.innerText = 'AURA pensando...';

      try {
        const res = await fetch(`${API_URL}/ai/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: chatHistory })
        });

        const data = await res.json();
        const reply = data.reply || data.error;

        if (data.reply) {
          chatHistory.push({ role: 'assistant', content: reply });
          localStorage.setItem('aura_history', JSON.stringify(chatHistory));
        }

        resBox.innerText = reply;
        speakText(reply);

      } catch (e) { 
        resBox.innerText = 'Erro ao conectar ao servidor.'; 
      }
    }

    async function generateEmail() {
      const recipient = document.getElementById('email-dest').value;
      const topic = document.getElementById('email-topic').value;
      const tone = document.getElementById('email-tone').value;
      const resBox = document.getElementById('email-response');
      if(!topic) return;
      resBox.innerText = 'Gerando minuta...';
      try {
        const res = await fetch(`${API_URL}/emails/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipient, topic, tone })
        });
        const data = await res.json();
        resBox.innerText = data.data ? data.data.content : data.error;
      } catch (e) { resBox.innerText = 'Erro ao gerar e-mail.'; }
    }

    // --- FINANÇAS E MOEDA ---
    function changeCurrency() {
      selectedCurrency = document.getElementById('currency-select').value;
      localStorage.setItem('aura_currency', selectedCurrency);
      loadFinances();
    }

    function getCurrencySymbol(curr) {
      if (curr === 'EUR') return '€';
      if (curr === 'USD') return '$';
      return 'CHF';
    }

    async function addTransaction() {
      const description = document.getElementById('fin-desc').value;
      const amount = parseFloat(document.getElementById('fin-amount').value);
      const type = document.getElementById('fin-type').value;
      if(!description || isNaN(amount)) return;
      try {
        await fetch(`${API_URL}/finances`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description, amount, type, currency: selectedCurrency })
        });
        document.getElementById('fin-desc').value = '';
        document.getElementById('fin-amount').value = '';
        loadFinances();
      } catch (e) { alert('Erro ao salvar.'); }
    }

    async function loadFinances() {
      const symbol = getCurrencySymbol(selectedCurrency);
      try {
        const res = await fetch(`${API_URL}/finances`);
        const data = await res.json();
        
        document.getElementById('fin-balance').innerText = `${symbol} ${data.summary.balance.toFixed(2)}`;

        const txList = document.getElementById('tx-list-container');
        if (data.transactions && data.transactions.length > 0) {
          txList.innerHTML = data.transactions.map(tx => `
            <div class="tx-item">
              <span>${tx.description}</span>
              <span class="tx-amount ${tx.type}">
                ${tx.type === 'income' ? '+' : '-'}${symbol} ${Math.abs(tx.amount).toFixed(2)}
              </span>
            </div>
          `).join('');
        } else {
          txList.innerHTML = '<span style="color:var(--text-dim); font-size:0.85rem;">Sem transações registadas.</span>';
        }

      } catch (e) {}
    }
    loadFinances();
  </script>
</body>
</html>
